# Builds the HRRR Tri-State map packages and the full-CONUS beta tiles, and publishes them with GitHub Pages (Actions artifact
# deployment: no data branch, no history growth). A deployment happens only after the whole site has
# been assembled and checked, so a failed run leaves the previous deployment in place.
name: HRRR maps
on:
  schedule:
    - cron: "12,42 * * * *"   # HRRR runs hourly; a run is published once all its forecast hours exist
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "archive/**", ".github/workflows/hrrr.yml"]
permissions:
  contents: read
concurrency: { group: hrrr-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.build.outputs.changed == 'true' || steps.trends.outputs.trends_changed == 'true' || steps.conus.outputs.conus_changed == 'true' || steps.nbm.outputs.nbm_changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -r pipeline/requirements.txt
      - name: Pipeline self-test
        run: python pipeline/test_hrrr.py
      - name: Build site (new runs processed, retained runs carried forward with hash checks)
        id: build
        run: |
          mkdir -p _site && cp -r site/. _site/
          python pipeline/hrrr.py --site _site --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT"
      # The previous build's CONUS output, so published hours are copied locally (hash-checked) instead of being
      # re-downloaded from GitHub Pages: re-downloading ~15,000 tiles a build was refused with HTTP 429 and dropped
      # a whole run from the index (build 873, 22 Nov 2026).
      - name: Restore previous CONUS build
        uses: actions/cache/restore@v4
        with: { path: _conus_prev, key: "conus-${{ github.run_id }}", restore-keys: "conus-" }
      - name: Full-CONUS HRRR tiles (beta; conus-v1) and source-grid spot check
        id: conus
        # Separate from the Tri-State packages: a failure republishes the previous CONUS data unchanged
        # (or none), and never blocks the Tri-State deployment. Before publishing, every field of the newest
        # run's f06 is decoded from the built tiles and compared with the GRIB grid (airports, the field's
        # maximum and random non-zero cells, all three zoom levels); any mismatch republishes the previous data.
        run: |
          python pipeline/test_conus.py \
            && python pipeline/conus.py --site _site --prev _conus_prev --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT" \
            && python pipeline/spotcheck_conus.py _site auto 6 --json _site/data/conus/spotcheck.json \
            || (rm -rf _site/data/conus && python pipeline/conus.py --carry-only --site _site --prev _conus_prev --published "https://wxman33.github.io/forecast-ops-maps") \
            || echo "::warning::CONUS tiles unavailable this run"
      - name: NBM temperature and PoP tiles (beta; conus-v1) and source-grid spot check
        id: nbm
        # After the HRRR step (its fallback replaces data/conus); a failure republishes the previous NBM data unchanged
        continue-on-error: true
        run: |
          python pipeline/nbm.py --site _site --prev _conus_prev --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT" \
            && python pipeline/spotcheck_conus.py _site auto 6 --model nbm --json _site/data/conus/nbm/spotcheck.json \
            || (rm -rf _site/data/conus/nbm && python pipeline/nbm.py --carry-only --site _site --prev _conus_prev --published "https://wxman33.github.io/forecast-ops-maps") \
            || echo "::warning::NBM tiles unavailable this run"
      - name: Keep this CONUS build for the next run
        if: always()
        run: rm -rf _conus_prev && mkdir -p _conus_prev && if [ -d _site/data/conus ]; then cp -r _site/data _conus_prev/ && rm -rf _conus_prev/data/hrrr _conus_prev/data/trends; fi
      - name: Save CONUS build cache
        if: always()
        uses: actions/cache/save@v4
        with: { path: _conus_prev, key: "conus-${{ github.run_id }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Trend archive self-test
        run: node archive/test/test_trends.js
        continue-on-error: true   # a failure shows in the log; the map deployment and the carry-only fallback are unaffected
      - name: CVG model-trend archive (confirmed 00Z/12Z runs + labelled snapshots)
        id: trends
        # A failed update republishes the previous archive unchanged; it never blocks the map deployment.
        run: |
          node archive/trends.js --site _site --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT" \
            || node archive/trends.js --carry-only --site _site --published "https://wxman33.github.io/forecast-ops-maps" \
            || echo "::warning::trend archive unavailable this run"
      - if: steps.build.outputs.changed == 'true' || steps.trends.outputs.trends_changed == 'true' || steps.conus.outputs.conus_changed == 'true' || steps.nbm.outputs.nbm_changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
