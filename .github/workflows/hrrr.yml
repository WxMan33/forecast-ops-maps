# Builds the HRRR Tri-State map packages and publishes them with GitHub Pages (Actions artifact
# deployment: no data branch, no history growth). A deployment happens only after the whole site has
# been assembled and checked, so a failed run leaves the previous deployment in place.
name: HRRR maps
on:
  schedule:
    - cron: "12,42 * * * *"   # HRRR runs hourly; a run is published once all its forecast hours exist
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "archive/**", ".github/workflows/hrrr.yml"]
permissions:
  contents: read
concurrency: { group: hrrr-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.build.outputs.changed == 'true' || steps.trends.outputs.trends_changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -r pipeline/requirements.txt
      - name: Pipeline self-test
        run: python pipeline/test_hrrr.py
      - name: Build site (new runs processed, retained runs carried forward with hash checks)
        id: build
        run: |
          mkdir -p _site && cp -r site/. _site/
          python pipeline/hrrr.py --site _site --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Trend archive self-test
        run: node archive/test/test_trends.js
        continue-on-error: true   # a failure shows in the log; the map deployment and the carry-only fallback are unaffected
      - name: CVG model-trend archive (confirmed 00Z/12Z runs + labelled snapshots)
        id: trends
        # A failed update republishes the previous archive unchanged; it never blocks the map deployment.
        run: |
          node archive/trends.js --site _site --published "https://wxman33.github.io/forecast-ops-maps" --changed-output "$GITHUB_OUTPUT" \
            || node archive/trends.js --carry-only --site _site --published "https://wxman33.github.io/forecast-ops-maps" \
            || echo "::warning::trend archive unavailable this run"
      - if: steps.build.outputs.changed == 'true' || steps.trends.outputs.trends_changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
