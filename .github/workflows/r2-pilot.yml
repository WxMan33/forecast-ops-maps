# R2 pilot (manual only): build the packed full-CONUS tiles and upload them to a Cloudflare R2 bucket.
# Needs, in this repository's Settings → Secrets and variables → Actions:
#   secrets   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   (bucket-scoped R2 token: Object Read & Write, that bucket only)
#   variables R2_ACCOUNT_ID, R2_BUCKET, R2_PUBLIC_URL  (e.g. forecast-ops-conus-pilot, https://pub-….r2.dev)
# Runs on the same schedule as the GitHub Pages build (HRRR maps) and can still be started by hand; the GitHub Pages maps
# are not touched. Hours already uploaded are carried from the previous build (Actions cache, hash-checked), so each run
# uploads only new hours, manifests and the indexes.
name: R2 maps (CONUS packed tiles)
on:
  schedule:
    - cron: "12,42 * * * *"   # alongside HRRR maps
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: r2-pilot, cancel-in-progress: false }
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -r pipeline/requirements.txt boto3==1.35.99
      - name: Self-test
        run: python pipeline/test_conus.py
      - name: Restore the previous R2 build
        uses: actions/cache/restore@v4
        with: { path: _r2_prev, key: "r2-${{ github.run_id }}", restore-keys: "r2-" }
      - name: Build packed HRRR tiles (hours already in the bucket are carried, new hours processed) and check them against the GRIB
        run: |
          python pipeline/conus.py --pack --site _r2 --prev _r2_prev --published "${R2_PUBLIC_URL%/}"
          python pipeline/spotcheck_conus.py _r2 auto 6
      - name: NBM temperature and PoP through Day 3 (F01-F48 hourly, F51-F72 3-hourly), packed, checked against the GRIB
        # A failed NBM build uploads no NBM index, so the sync keeps the NBM data already in the bucket; HRRR still uploads
        continue-on-error: true
        run: |
          python pipeline/nbm.py --pack --through 72 --site _r2 --prev _r2_prev --published "${R2_PUBLIC_URL%/}" \
            && python pipeline/spotcheck_conus.py _r2 auto 6 --model nbm \
            && python pipeline/spotcheck_conus.py _r2 auto 72 --model nbm \
            || { rm -rf _r2/data/conus/nbm; echo "::warning::NBM not built this run; R2 keeps its existing NBM data"; }
      - name: RRFS 3 km CONUS (00/06/12/18Z to F48, 03/09/15/21Z to F18), packed, checked against the GRIB
        # A failed RRFS build uploads no RRFS index, so the sync keeps the RRFS data already in the bucket
        continue-on-error: true
        run: |
          python pipeline/rrfs.py --pack --through 48 --site _r2 --prev _r2_prev --published "${R2_PUBLIC_URL%/}" \
            && python pipeline/spotcheck_conus.py _r2 auto 0 --model rrfs \
            && python pipeline/spotcheck_conus.py _r2 auto 6 --model rrfs \
            || { rm -rf _r2/data/conus/rrfs; echo "::warning::RRFS not built this run; R2 keeps its existing RRFS data"; }
      - name: ECMWF IFS open data 0.25° over the CONUS (00/12Z, F00-F120 every 3 h), packed, checked against the GRIB
        # Source: ECMWF open data on its AWS mirror (s3://ecmwf-forecasts), © ECMWF, CC BY 4.0. A failed ECMWF build uploads no
        # ECMWF index, so the sync keeps the ECMWF data already in the bucket. The Kuchera snowfall (asnowk_run) is recomputed
        # independently from every 3-h step's GRIB up to the checked step: at F06 with the other fields, and alone at F24
        # (8 steps, about 21 MB) rather than at F96 (32 steps, about 83 MB, on every run of this workflow)
        continue-on-error: true
        run: |
          python pipeline/ecmwf.py --pack --site _r2 --prev _r2_prev --published "${R2_PUBLIC_URL%/}" \
            && python pipeline/spotcheck_conus.py _r2 auto 0 --model ecmwf \
            && python pipeline/spotcheck_conus.py _r2 auto 6 --model ecmwf \
            && python pipeline/spotcheck_conus.py _r2 auto 96 --model ecmwf --skip asnowk_run \
            && python pipeline/spotcheck_conus.py _r2 auto 24 --model ecmwf --only asnowk_run \
            || { rm -rf _r2/data/conus/ecmwf; echo "::warning::ECMWF not built this run; R2 keeps its existing ECMWF data"; }
      - name: Upload changes to R2 and remove expired runs
        shell: bash   # -o pipefail: a missing setting or failed upload fails the run (tee alone would hide it)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pipeline/r2_sync.py --site _r2 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep this build for the next run
        run: rm -rf _r2_prev && mkdir -p _r2_prev && cp -r _r2/data _r2_prev/
      - name: Save the R2 build cache
        uses: actions/cache/save@v4
        with: { path: _r2_prev, key: "r2-${{ github.run_id }}" }
