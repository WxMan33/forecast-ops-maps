# Manual, read-only probe of Open-Meteo run-specific endpoints (no data stored, nothing deployed).
name: Probe run identity
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/run-identity.js
